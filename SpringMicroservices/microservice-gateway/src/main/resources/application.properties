server.port=8080

spring.config.import=optional:configserver:http//localhost:8888
spring.application.name=microservice-gateway
spring.cloud.gateway.discovery.locator.enabled=true


spring.cloud.gateway.routes[0].id=students
spring.cloud.gateway.routes[0].uri=http://localhost:8090
spring.cloud.gateway.routes[0].predicates[0]=Path=/estudiantes/**

spring.cloud.gateway.routes[1].id=courses
spring.cloud.gateway.routes[1].uri=http://localhost:9090
spring.cloud.gateway.routes[1].predicates[0]=Path=/cursos/**


